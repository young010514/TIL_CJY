<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <!-- 네비게이션 바 -->
    <nav class="navbar">
      <a href="basic.html" class="nav-link">기본 정보 수정</a>
      <a href="portfolio.html" class="nav-link active">포트폴리오 수정페이지</a>
    </nav>

    <!-- 금융 포트폴리오 정보 -->
    <div class="basic-info-section">
      <h2>회원의 금융 포트폴리오 정보</h2>

      <div class="info-row">
        <div class="info-label">회원정보</div>
        <div class="info-value">
          <input type="text" value="일반 회원" readonly>
        </div>
      </div>

      <div class="info-row">
        <div class="info-label">ID</div>
        <div class="info-value">
          <input type="text" value="user1234" readonly>
        </div>
      </div>

      <div class="info-row">
        <div class="info-label">저축성향</div>
        <div class="info-input-wrap savings-options">
          <label><input type="radio" name="saving-type">소비형</label>
          <label><input type="radio" name="saving-type">균형형</label>
          <label><input type="radio" name="saving-type">저축형</label>
        </div>
        <button type="button" class="update-btn">Update</button>
      </div>

      <div class="info-row">
        <div class="info-label">최애 은행</div>
        <div class="info-input-wrap">
          <input type="text" placeholder="선호하는 은행명을 입력하세요">
        </div>
        <button type="button" class="update-btn">Update</button>
      </div>
    </div>
  </div>
</body>

</html>
