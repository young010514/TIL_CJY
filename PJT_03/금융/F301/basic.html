<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>기본 정보 수정 페이지</title>
  <link rel="stylesheet" href="style.css">

</head>

<body>
  <div class="container">
    <!-- 네비게이션 바 -->
    <nav class="navbar">
      <a href="basic.html" class="nav-link">기본 정보 수정</a>
      <a href="portfolio.html" class="nav-link active">포트폴리오 수정페이지</a>
    </nav>
    <!-- F301 -->
    <h1>기본 정보 수정 페이지</h1>



    <div class="profile-section">
      <!-- 왼쪽 영역 -->
      <div class="left-box">
        <div class="profile-image">
          <img src="profile.jpg" alt="프로필 사진" />
        </div>

        <div class="intro-box">
          <h2>자기소개</h2>
          <textarea placeholder="자기소개를 입력하세요."></textarea>
          <button type="button">소개 저장</button>
        </div>
      </div>

      <!-- 오른쪽 영역 -->
      <div class="right-box">
        <h2>투자 성향</h2>

        <div class="option-group">
          <h3>1) 투자 상품 선호도</h3>
          <label><input type="checkbox" name="product" /> 주식</label>
          <label><input type="checkbox" name="product" /> ETF</label>
          <label><input type="checkbox" name="product" /> 채권</label>
          <label><input type="checkbox" name="product" /> 펀드</label>
          <label><input type="checkbox" name="product" /> 가상자산</label>
          <label><input type="checkbox" name="product" /> 금</label>
        </div>

        <div class="option-group">
          <h3>2) 투자 스타일</h3>
          <label><input type="radio" name="style" /> 안정형</label>
          <label><input type="radio" name="style" /> 중립형</label>
          <label><input type="radio" name="style" /> 공격형</label>
        </div>

        <div class="option-group">
          <h3>3) 관심종목</h3>
          <label><input type="checkbox" name="interest" /> 삼성전자</label>
          <label><input type="checkbox" name="interest" /> 애플</label>
          <label><input type="checkbox" name="interest" /> 테슬라</label>
          <label><input type="checkbox" name="interest" /> 엔비디아</label>
          <label><input type="checkbox" name="interest" /> 비트코인</label>
          <label><input type="checkbox" name="interest" /> 이더리움</label>
        </div>
      </div>
    </div>

    <div class="save-area">
      <button type="button">전체 정보 저장</button>
    </div>
  </div>

  <!-- F302 회원 정보 -->
  <div class="basic-info-section">
    <h2>기본정보</h2>

    <div class="info-row">
      <div class="info-label">회원정보</div>
      <div class="info-value">
        <input type="text" value="일반 회원" readonly>
      </div>
    </div>

    <div class="info-row">
      <div class="info-label">ID</div>
      <div class="info-value">
        <input type="text" value="user1234" readonly>
      </div>
    </div>

    <div class="info-row">
      <div class="info-label">Email</div>
      <div class="info-input-wrap">
        <input type="email" value="sample@email.com">
      </div>
      <button type="button" class="update-btn">Update</button>
    </div>

    <div class="info-row">
      <div class="info-label">Nickname</div>
      <div class="info-input-wrap">
        <input type="text" placeholder="닉네임을 입력하세요">
      </div>
      <button type="button" class="update-btn">Update</button>
    </div>

    <div class="info-row">
      <div class="info-label">나이</div>
      <div class="info-input-wrap">
        <input type="number" placeholder="나이를 입력하세요">
      </div>
      <button type="button" class="update-btn">Update</button>
    </div>

    <div class="info-row">
      <div class="info-label">자산 / 연봉</div>
      <div class="info-input-wrap inline-inputs">
        <input type="number" placeholder="자산">
        <input type="number" placeholder="연봉">
      </div>
      <button type="button" class="update-btn">Update</button>
    </div>
  </div>


</body>

</html>
