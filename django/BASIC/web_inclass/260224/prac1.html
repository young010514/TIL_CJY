<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h3>먹고 싶은 것을 선택하시오(중복체크 가능)</h3>
  <p>
    치킨 <input type="checkbox">
    피자 <input type="checkbox">
    떡갈비 <input type="checkbox">
    오리탕 <input type="checkbox">
    김떡순 <input type="checkbox">
  </p>
  <hr>
  
  <h3>해당되는 트랙을 체크하시오</h3>
  <p>
    파이썬 <input type="radio">
    자바 <input type="radio">
    임베디드 <input type="radio">
  </p>
  <p>
    해당 반을 선택하세요.
    <select name="class" id="class">
      <option value="s01">서울1반</option>
      <option value="s02">서울2반</option>
      <option value="s03">서울3반</option>
      <option value="s04">서울4반</option>
      <option value="s05" selected="true">서울5반</option>
    </select>
  </p>



</body>
</html>
